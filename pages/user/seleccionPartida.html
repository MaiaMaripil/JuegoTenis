<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/selecPartidaStyle.css">
    <title>Crear nueva partida</title>
</head>

<body class="paginas">
    <header>
        <a href="pages\user\partidas.html" class="link-volver">← Volver</a>
    </header>

    <!--Seccion contenedora del formulario para crear una nueva partida-->
    <section class="tarjeta">
        <h2>Crear partida</h2>

        <!--Formulario-->
        <form class="form-partida">

            <!--Ingresar nombre de la partida-->
            <label for="titulo">Nombre de la partida</label>
            <input type="text" id="titulo" name="titulo" placeholder="Nombre">

            <!--Seleccionar dificultad-->
            <label>Dificultad</label>
            <div class="dificultad">
                <button type="button" class="boton-dif">Baja</button>
                <button type="button" class="boton-dif">Intermedia</button>
                <button type="button" class="boton-dif">Alta</button>
            </div>

            <!--Boton para guardar la nueva partida-->
            <button type="submit" class="boton-guardar">GUARDAR</button>
        </form>

    </section>

</body>

</html>
