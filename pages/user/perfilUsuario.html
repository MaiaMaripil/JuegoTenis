<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Mi perfil</title>
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="../../styles/perfilUsuarioSyle.css">
    <script src="../../js/carousel.js"></script>
</head>

<body class="paginas">
    <div data-header="home"></div>

    <main>

        <section class="tarjeta columnas tarjeta-perfil borde-deco-simple">
            <div class="foto-perfil-marco">
                <img class="foto_perfil foto_perfil_retrato" src="../../img/User_icon.svg" alt="Avatar de Juana Rivera">
            </div>
            <div>
                <h1 class="unifrakturmaguntia-regular">Juana Rivera</h1>
                <p>Agilidad: 82</p>
                <p>Golpe: 76</p>
                <button onclick="cerrarSesion()">Cerrar sesion</button>
            </div>
        </section>

        <section class = "tarjeta tarjeta-inventario">
            <h2 class="titulo titulo-inventario">Inventario</h2>
            <div id="inventario">
                <div class="etiqueta" id="etiqueta-der">GUANTES</div>
                <div class="etiqueta" id="etiqueta-izq">ZAPATOS</div>
                <div class="rueda" id="rueda-der"></div>
                <div class="rueda" id="rueda-izq"></div>
            </div>
        </section>
    </main>
    
    <div class="delimitador_deco"></div>
    
    <script src="../../js/login.js"></script>
    <script src="../../js/header.js"></script>
</body>
</html>
